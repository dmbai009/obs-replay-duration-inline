name: Build Windows x64
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: obsproject/obs-plugintemplate
          ref: 3e7d7ac3b5342cd7d9b88890b9c70b472d1520fc
          path: .obs-build-template
      - name: Prepare sources
        shell: pwsh
        run: |
          Copy-Item CMakeLists.txt .obs-build-template/CMakeLists.txt -Force
          # Pin exact OBS 31.0.2 sources: determine zip SHA-256 before CMake validates it.
          $archive = Join-Path $env:RUNNER_TEMP 'obs-studio-31.0.2.zip'
          Invoke-WebRequest 'https://github.com/obsproject/obs-studio/archive/refs/tags/31.0.2.zip' -OutFile $archive
          $digest = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "OBS 31.0.2 source SHA256: $digest"
          $buildspec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          $buildspec.dependencies.'obs-studio'.hashes.'windows-x64' = $digest
          $buildspec | ConvertTo-Json -Depth 20 | Set-Content .obs-build-template/buildspec.json -Encoding utf8
          Copy-Item src/plugin-main.cpp .obs-build-template/src/plugin-main.cpp -Force
      - name: Configure and build
        shell: pwsh
        working-directory: .obs-build-template
        run: |
          cmake --preset windows-ci-x64 -DENABLE_FRONTEND_API:BOOL=ON -DENABLE_QT:BOOL=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-x64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package DLL
        shell: pwsh
        run: |
          $dll = '.obs-build-template/build_x64/Release/obs-replay-duration-inline.dll'
          if (-not (Test-Path $dll)) { throw 'Missing compiled plugin DLL' }
          New-Item -ItemType Directory -Force dist/obs-plugins/64bit | Out-Null
          Copy-Item $dll dist/obs-plugins/64bit/obs-replay-duration-inline.dll
          Copy-Item LICENSE dist/LICENSE.txt
          Compress-Archive -Path dist/* -DestinationPath obs-replay-duration-inline-v1.0.0-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: obs-replay-duration-inline-windows-x64
          path: obs-replay-duration-inline-v1.0.0-windows-x64.zip
          if-no-files-found: error
      - name: Publish stable release
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'release: v1.0.0' }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: OBS Replay Duration Inline v1.0.0
          prerelease: false
          make_latest: true
          body: 'First stable release, based on tested beta.3. OBS 31.0.2 Windows x64: replay clips of 30 and 60 seconds, persistence, UI layout and Save Replay confirmed. Other OBS versions unverified.'
          files: obs-replay-duration-inline-v1.0.0-windows-x64.zip
          fail_on_unmatched_files: true
